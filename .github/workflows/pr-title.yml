name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR title
        shell: bash
        run: |
          set -euo pipefail
          TITLE='${{ github.event.pull_request.title }}'
          ./scripts/check_change_title.sh "$TITLE"
